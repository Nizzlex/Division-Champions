<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Division Champions ⚽</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7fafc;background:#071c19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#215d49,#071c19 65%);min-height:100dvh}.app{max-width:680px;margin:auto;padding:18px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:21px;font-weight:900;letter-spacing:-.5px}.pill{background:#ffffff19;border:1px solid #ffffff25;border-radius:999px;padding:8px 12px;font-size:13px}.track{height:10px;border-radius:30px;background:#ffffff20;overflow:hidden;margin:18px 0 10px}.fill{height:100%;width:0;background:linear-gradient(90deg,#f8c842,#a8e65e);transition:width .3s}.stats{display:flex;justify-content:space-between;color:#c2d7cf;font-size:13px}.card{background:#10362e;border:1px solid #ffffff23;border-radius:22px;padding:22px 18px;margin-top:18px;box-shadow:0 18px 35px #0003}.eyebrow{color:#f8d46a;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:900}.title{font-size:clamp(25px,6vw,36px);font-weight:950;line-height:1.13;margin:9px 0}.desc{line-height:1.55;color:#e0eee7}.pitch{height:135px;border:2px solid #d8ffb988;border-radius:12px;position:relative;margin:18px 0;background:repeating-linear-gradient(90deg,#187748 0 55px,#1a814d 55px 110px);overflow:hidden}.pitch:before{content:'';position:absolute;inset:8px;border:2px solid #ffffff77}.pitch:after{content:'';position:absolute;top:9px;bottom:9px;left:50%;border-left:2px solid #ffffff77}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;z-index:1;filter:drop-shadow(0 2px 5px #0007)}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary{background:#f8c842;color:#182718;border:0;border-radius:15px;font-size:17px;font-weight:900;padding:16px;width:100%;margin-top:12px}.secondary{background:#ffffff15;color:#fff;border:1px solid #ffffff40;border-radius:13px;padding:12px 14px;font-weight:700}.secondary:disabled{opacity:.4}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.step{font-size:12px;padding:8px 9px;border-radius:10px;background:#ffffff16;color:#c9dcd3}.step.active{background:#f8c842;color:#1c2b19;font-weight:900}.math{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#071f1b;border-radius:15px;padding:17px 12px;margin:18px 0;text-align:center;font-size:clamp(24px,6.3vw,34px);letter-spacing:2px;font-weight:900}.math small{display:block;color:#c1d8ce;font:500 13px system-ui;letter-spacing:0;margin-top:10px}.question{font-size:20px;font-weight:850;line-height:1.4;margin:18px 0 12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{padding:18px 5px;border:2px solid #ffffff35;background:#ffffff13;border-radius:15px;color:white;font-size:24px;font-weight:900;min-height:67px}.choice:active{transform:scale(.97)}.choice.correct{border-color:#9ffb7b;background:#267844}.choice.wrong{border-color:#ff9a8f;background:#863e39}.message{padding:15px;border-radius:14px;margin:14px 0;background:#25583e;border:1px solid #a9f0a655;line-height:1.5}.message.bad{background:#6a3832;border-color:#ffb1a077}.mini{font-size:13px;color:#b9d1c4}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.hide{display:none!important}.badge{font-size:14px;background:#2b6249;padding:7px 10px;border-radius:999px}.trophy{text-align:center;font-size:74px;margin:20px 0 5px}.lesson{background:#1b4b3b;padding:13px;border-radius:13px;margin:12px 0;line-height:1.5}.lesson strong{color:#ffe28d}.footer{font-size:12px;color:#aac5b8;text-align:center;margin-top:25px}.numberline{font-size:20px;letter-spacing:4px;word-break:break-all}.help{color:#f9dd8a;font-size:14px}.buttons{display:flex;gap:8px;margin-top:12px}.buttons>*{flex:1}.logo{font-size:27px} .tiny{font-size:12px;color:#bcd3c9} .review{padding:12px 0;border-bottom:1px solid #ffffff24}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="logo">⚽</span> DIVISION CHAMPIONS</div><div class="pill" id="score">⭐ 0 Punkte</div></header><div class="track"><div class="fill" id="bar"></div></div><div class="stats"><span id="levelLabel">Trainingslager</span><span id="progress">0 / 10 Level</span></div><section id="screen" aria-live="polite"></section><div class="footer">Mathetraining Klasse 4 · Läuft auch ohne Internet · Deine Fortschritte bleiben auf diesem Gerät</div></main><script>
const levels=[
{n:12,d:3,name:'Anstoß',story:'12 Fußbälle werden auf 3 Mannschaften verteilt.',intro:'Wir starten ganz einfach. Teilen bedeutet: Alle bekommen gleich viel.'},
{n:84,d:2,name:'Passspiel',story:'84 Fans fahren in 2 gleich großen Bussen.',intro:'Wir rechnen von links nach rechts: erst die Zehner, dann die Einer.'},
{n:96,d:3,name:'Trikottraining',story:'96 Trikots werden auf 3 Mannschaften verteilt.',intro:'Eine Ziffer nach der anderen – wie ein sauberer Pass.'},
{n:248,d:2,name:'Heimspiel',story:'248 Eintrittskarten werden auf 2 Fanclubs verteilt.',intro:'Jetzt kommen Hunderter dazu. Die vier Schritte bleiben gleich.'},
{n:648,d:3,name:'Auswärtsspiel',story:'648 Tickets werden gleichmäßig auf 3 Fanclubs verteilt.',intro:'Manchmal bleibt etwas übrig. Das nehmen wir zur nächsten Stelle mit.'},
{n:735,d:5,name:'Elfmeter',story:'735 Sammelkarten werden auf 5 Fußballteams verteilt.',intro:'Wenn die erste Ziffer zu klein ist, nimmst du die ersten zwei Ziffern zusammen.'},
{n:816,d:4,name:'Halbfinale',story:'816 Trainingshütchen werden auf 4 Gruppen verteilt.',intro:'Eine Null im Ergebnis ist erlaubt. Sie hält ihren Platz frei.'},
{n:924,d:7,name:'Pokalfight',story:'924 Autogrammkarten werden auf 7 Fanclubs verteilt.',intro:'Du kannst schon viel! Rechne konzentriert weiter.'},
{n:856,d:4,name:'Champions League',story:'856 Stadionplätze werden auf 4 Tribünenblöcke verteilt.',intro:'Denk immer an die vier Schritte – egal wie groß die Zahl ist.'},
{n:987,d:6,name:'Das große Finale',story:'987 Fanartikel werden auf 6 Mannschaften verteilt.',intro:'Im Finale darf ein Rest übrig bleiben. Du schaffst das!'}];
let state={level:0,score:0,phase:0,tries:0,completed:false};try{let s=JSON.parse(localStorage.getItem('divisionChampionsSave'));if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<=10)state={...state,...s,phase:0,tries:0}}catch(e){};
const $=id=>document.getElementById(id);function save(){localStorage.setItem('divisionChampionsSave',JSON.stringify(state))}function html(s){$('screen').innerHTML=s}function update(){let l=Math.min(state.level,10);$('bar').style.width=(l*10)+'%';$('score').textContent='⭐ '+state.score+' Punkte';$('progress').textContent=l+' / 10 Level';$('levelLabel').textContent=l<10?'Level '+(l+1)+': '+levels[l].name:'Pokal gewonnen'}
function pitch(){return '<div class="pitch"><span class="center">⚽</span></div>'}function home(){update();html('<div class="card"><div class="eyebrow">Dein Fußball-Mathe-Abenteuer</div><h1 class="title">Werde Meister im schriftlichen Dividieren! 🏆</h1>'+pitch()+'<p class="desc">Du bist der Trainer. Löse Mathe-Aufgaben, sammle Tore und gewinne den Pokal. Du musst nichts aufschreiben – tippe einfach die richtige Zahl an.</p><div class="lesson"><strong>Dein Trick für jedes Spiel:</strong><br>1. Wie oft passt die Zahl hinein?<br>2. Malnehmen<br>3. Abziehen<br>4. Die nächste Ziffer dazunehmen</div><button class="primary" onclick="begin()">'+(state.level?'▶ Training fortsetzen':'▶ Spiel starten')+'</button><p class="mini">10 Level · ungefähr 30–45 Minuten · mit Hilfen und Fehlererklärungen</p></div>')}
function begin(){if(state.level>=10){finish();return}state.phase=0;state.tries=0;renderLevel()}
function buildSteps(n,d){let digits=String(n).split('').map(Number),rem=0,steps=[],quot='';for(let i=0;i<digits.length;i++){let before=rem,cur=rem*10+digits[i],q=Math.floor(cur/d),prod=q*d,r=cur-prod;steps.push({i,digit:digits[i],before,cur,q,prod,r,place:digits.length-i-1});quot+=q;rem=r}return {steps,answer:parseInt(quot,10),remainder:rem}}
function renderLevel(){update();let l=levels[state.level],b=buildSteps(l.n,l.d);html('<div class="card"><div class="eyebrow">Level '+(state.level+1)+' von 10 · '+l.name+'</div><h1 class="title">'+l.story+'</h1><p class="desc">'+l.intro+'</p>'+pitch()+'<div class="math">'+l.n+' : '+l.d+' = ?<small>Wie viele bekommt jede Mannschaft oder Gruppe?</small></div><div class="lesson"><strong>Merke:</strong> Wir teilen die Zahl Stück für Stück von links nach rechts. Erst Hunderter, dann Zehner, dann Einer.</div><button class="primary" onclick="startSteps()">⚽ Aufgabe lösen</button></div>')}
let calc=null,stage=0,stageAnswer=0,choices=[],correctQ='';function startSteps(){let l=levels[state.level];calc=buildSteps(l.n,l.d);state.phase=0;stage=0;showStep()}
function stageInfo(){let l=levels[state.level],s=calc.steps[stage],p=['Einer','Zehner','Hunderter','Tausender'][s.place]||'Stelle',carry=s.before,cur=s.cur;let qText=carry?`Vom vorherigen Schritt sind ${carry} übrig. Mit der nächsten Ziffer ${s.digit} werden daraus ${cur}.`:`Wir schauen uns die nächste Ziffer ${s.digit} an.`;return {l,s,p,cur,qText}}
function showStep(){let {l,s,p,cur,qText}=stageInfo();let phase=state.phase;let result=calc.steps.slice(0,stage).map(x=>x.q).join('')||'–';let labels=['1. Teilen','2. Malnehmen','3. Abziehen','4. Weitergehen'];let prompt,explain,ans;if(phase===0){prompt=`Wie oft passt die ${l.d} in die ${cur}?`;explain=`Suche die größte ganze Zahl, die du mit ${l.d} malnehmen kannst, ohne über ${cur} zu kommen.`;ans=s.q}else if(phase===1){prompt=`${s.q} × ${l.d} = ?`;explain=`Du hast ${s.q} Gruppen mit je ${l.d}. Wie viele sind das zusammen?`;ans=s.prod}else if(phase===2){prompt=`${cur} − ${s.prod} = ?`;explain=`Ziehe die bereits verteilten ${s.prod} ab. Was bleibt übrig?`;ans=s.r}else{prompt=stage<calc.steps.length-1?`Die nächste Ziffer ist ${calc.steps[stage+1].digit}. Welche Zahl entsteht aus dem Rest ${s.r} und dieser Ziffer?`:`Alle Ziffern sind bearbeitet. Wie groß ist der Rest?`;explain=stage<calc.steps.length-1?`Stell dir vor: ${s.r} ${p} sind noch übrig. Wir gehen eine Stelle weiter und nehmen die nächste Ziffer ${calc.steps[stage+1].digit} dazu. So entsteht ${s.r} × 10 + ${calc.steps[stage+1].digit}.`:'Nichts mehr dazunehmen. Der letzte Rest bleibt stehen.';ans=stage<calc.steps.length-1?s.r*10+calc.steps[stage+1].digit:s.r}
stageAnswer=ans;correctQ=explain;let opts=new Set([ans]);for(let offset of [1,-1,2,-2,3,10,-10,5]){let v=ans+offset;if(v>=0&&opts.size<3)opts.add(v)}choices=[...opts].sort((a,b)=>((a*7+stage*3+phase*5)%13)-((b*7+stage*3+phase*5)%13));let display=phase===3?`<div class="lesson">${s.r} bleibt übrig. ${stage<calc.steps.length-1?'Wir nehmen jetzt die nächste Ziffer <strong>'+calc.steps[stage+1].digit+'</strong> dazu.':'Wir sind am Ende der Zahl.'}</div>`:`<div class="lesson">${qText}</div>`;html(`<div class="card"><div class="row"><span class="eyebrow">${l.name}</span><span class="badge">Schritt ${stage+1}/${calc.steps.length}</span></div><div class="steps">${labels.map((x,i)=>`<span class="step ${i===phase?'active':''}">${x}</span>`).join('')}</div><div class="math">${l.n} : ${l.d} = <span style="color:#f8d46a">${result}</span>${stage===0?'':'…'}<small>Wir rechnen gerade mit ${cur} · ${p}</small></div>${display}<div class="question">${prompt}</div><div class="choices">${choices.map(v=>`<button class="choice" onclick="answer(${v},this)">${v}</button>`).join('')}</div><div id="feedback"></div><div class="buttons"><button class="secondary" onclick="hint()">💡 Tipp</button><button class="secondary" onclick="renderLevel()">↩ Zur Aufgabe</button></div></div>`)}
function hint(){let {l,s,cur}=stageInfo();let hints=[`Versuche die ${l.d}er-Reihe: ${Array.from({length:Math.min(8,Math.floor(cur/l.d)+2)},(_,i)=>(i+1)+' × '+l.d+' = '+((i+1)*l.d)).join(' · ')}`,`Rechne ${s.q} mal ${l.d}. Du kannst auch ${l.d} wiederholt addieren.`,`Von ${cur} nimmst du ${s.prod} weg.`,correctQ];$('feedback').innerHTML='<div class="message">💡 '+hints[state.phase]+'</div>'}
function answer(v,el){let buttons=document.querySelectorAll('.choice');if(v!==stageAnswer){state.tries++;el.classList.add('wrong');$('feedback').innerHTML='<div class="message bad">Fast! Das ist noch nicht richtig. '+correctQ+'<br><strong>Versuch es noch einmal!</strong></div>';return}buttons.forEach(b=>b.disabled=true);el.classList.add('correct');if(state.tries===0)state.score+=10;else state.score+=5;state.tries=0;save();$('score').textContent='⭐ '+state.score+' Punkte';let extra=state.phase===0&&stageInfo().s.q===0?'Die 0 ist wichtig: An dieser Stelle bekommt jede Gruppe nichts. Wir behalten den Platz trotzdem im Ergebnis.':'';$('feedback').innerHTML='<div class="message">⚽ <strong>TOOOR! Richtig!</strong> '+extra+'</div><button class="primary" onclick="nextStep()">Weiter ➜</button>'}
function nextStep(){if(state.phase<3){state.phase++;showStep()}else if(stage<calc.steps.length-1){stage++;state.phase=0;showStep()}else{levelDone()}}
function levelDone(){let l=levels[state.level],c=calc;let result=c.answer;state.level++;state.phase=0;save();update();html(`<div class="card"><div class="trophy">${state.level===10?'🏆':'🥅'}</div><h1 class="title" style="text-align:center">TOOOR! Level geschafft!</h1><p class="desc" style="text-align:center">Du hast die Aufgabe Schritt für Schritt gelöst.</p><div class="math">${l.n} : ${l.d} = ${result}${c.remainder?' Rest '+c.remainder:''}</div><div class="lesson"><strong>Kontrolle:</strong> ${result} × ${l.d}${c.remainder?' + '+c.remainder:''} = ${l.n}. Stimmt!</div><button class="primary" onclick="${state.level===10?'finish()':'begin()'}">${state.level===10?'🏆 Pokal abholen':'⚽ Nächstes Level'}</button></div>`)}
function finish(){update();html(`<div class="card"><div class="trophy">🏆</div><h1 class="title" style="text-align:center">DU BIST DIVISION CHAMPION!</h1><p class="desc" style="text-align:center">Alle 10 Level geschafft. ${state.score} Punkte gesammelt. Du hast Teilen, Malnehmen, Abziehen und die nächste Ziffer dazunehmen trainiert!</p><div class="lesson"><strong>Dein Spickzettel im Kopf:</strong><br>⚽ Wie oft passt die Zahl hinein?<br>⚽ Ergebnis mal Divisor<br>⚽ Abziehen: Was bleibt?<br>⚽ Nächste Ziffer dazunehmen<br>⚽ Zum Schluss: Ergebnis × Divisor + Rest = Startzahl</div><button class="primary" onclick="reset()">🔁 Noch einmal trainieren</button></div>`)}
function reset(){if(confirm('Möchtest du alle Level und Punkte zurücksetzen?')){state={level:0,score:0,phase:0,tries:0,completed:false};save();home()}}home();</script></body></html>
